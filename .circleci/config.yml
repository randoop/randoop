version: 2.1

jobs:
  nonSystemTest-jdk8:
    docker:
      - image: mdernst/randoop-ubuntu-jdk8
    environment:
      TERM: dumb
    resource_class: large

    steps:

      - restore_cache:
          keys:
            - source-v2-{{ .Branch }}-{{ .Revision }}
            - source-v2-{{ .Branch }}-
            - source-v2-
      - checkout
      - save_cache:
          key: source-v2-{{ .Branch }}-{{ .Revision }}
          paths:
            - ".git"

      - restore_cache:
          keys:
            - gradle-v2-{{ .Branch }}-{{ checksum "build.gradle.kts" }}
            - gradle-v2-{{ .Branch }}-
            - gradle-v2-

      - run: export ORG_GRADLE_PROJECT_jdkTestVersion=8 && ./scripts/test-nonSystemTest.sh

      - save_cache:
          paths:
            - ~/.gradle
          key: gradle-v2-{{ .Branch }}-{{ checksum "build.gradle.kts" }}

      # From https://circleci.com/docs/2.0/collect-test-data/#gradle-junit-results
      - run:
          name: Save test results
          command: |
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - store_test_results:
          path: ~/test-results
      - store_artifacts:
          path: ~/test-results/junit

