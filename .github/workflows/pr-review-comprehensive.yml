name: PR Review with Progress Tracking

"on":
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review at a time per pull request.  Upon a push to a pull request,
# cancel any running review rather than pay for a review of stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Claude cannot push or merge; it can only comment.
      pull-requests: write # To post the review.
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          # The review comes out of your subscription rather than being metered.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enable progress tracking
          # When track_progress is enabled:
          # - Creates a tracking comment with progress checkboxes
          # - Includes all PR context (comments, attachments, images)
          # - Updates progress as the review proceeds
          # - Marks as completed when done
          track_progress: true

          # Your custom review instructions
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a comprehensive code review.
            Do not provide praise or summarize the changes; only point out problems and suggestions for improvement.
            Provide detailed feedback using inline comments for specific issues.
            Use top-level comments for general observations.

          # Tools for comprehensive PR review
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
